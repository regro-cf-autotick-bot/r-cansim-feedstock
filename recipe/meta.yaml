{% set version = "0.5.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-cansim
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/cansim_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/cansim/cansim_{{ version }}.tar.gz
  sha256: 3bd02b22c0b8a6bd9045ef2a158023f7ed1eb3ee4663e46b8bee75a203ab417c

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-dbi >=1.2
    - r-rsqlite >=2.3
    - r-arrow >=18.1
    - r-dbplyr >=2.5
    - r-digest >=0.6
    - r-dplyr >=1.1
    - r-httr >=1.0.0
    - r-purrr >=1.0
    - r-readr >=2.1
    - r-rlang >=1.1
    - r-stringr >=1.5
    - r-tibble >=3.2
    - r-tidyr >=1.3
  run:
    - r-base
    - r-dbi >=1.2
    - r-rsqlite >=2.3
    - r-arrow >=18.1
    - r-dbplyr >=2.5
    - r-digest >=0.6
    - r-dplyr >=1.1
    - r-httr >=1.0.0
    - r-purrr >=1.0
    - r-readr >=2.1
    - r-rlang >=1.1
    - r-stringr >=1.5
    - r-tibble >=3.2
    - r-tidyr >=1.3

test:
  commands:
    - $R -e "library('cansim')"           # [not win]
    - "\"%R%\" -e \"library('cansim')\""  # [win]

about:
  home: https://github.com/mountainMath/cansim, https://mountainmath.github.io/cansim/, https://www.statcan.gc.ca/
  license: MIT
  summary: Searches for, accesses, and retrieves new-format and old-format Statistics Canada data tables, as well as individual vectors, as tidy data frames. This package deals with encoding issues, allows for bilingual English or French language data retrieval, and bundles convenience functions to make it easier to 
    work with retrieved table data. Optional caching features are provided.
  license_family: MIT
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/MIT'
    - LICENSE

extra:
  recipe-maintainers:
    - conda-forge/r
    - vitodelgrec

